name: Import backend skill

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [backend-skill-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-backend-skill
  cancel-in-progress: false

jobs:
  import:
    name: Import https://protocol.useagentbank.com/SKILL.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: automation/import-backend-skill
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - run: npm ci
      - run: npm run import:backend
      - run: npm run check

      - name: Open or update the import pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Generated skill files already match the backend."
            exit 0
          fi
          sha="$(node -p "require('./protocol-core-sync.json').source_sha256")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A skills dist protocol-core-sync.json
          git commit -m "chore: import backend skill ${sha:0:12}"
          git push --force origin "$BRANCH"
          body=$'Generated by `scripts/import-backend-skill.mjs` from https://protocol.useagentbank.com/SKILL.md.\n\nBackend sha256: `'"$sha"$'`\n\nDo not edit these files by hand; change the wording in the AgentBank backend.'
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "chore: import backend skill ${sha:0:12}" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore: import backend skill ${sha:0:12}" --body "$body"
          fi

      # The import, `npm run check` and the byte-for-byte backend check below all
      # passed in this run, so the PR is merged here. PRs opened with GITHUB_TOKEN
      # do not trigger the Validate workflow, so waiting for its checks would never
      # finish. Set the repository variable AGENTBANK_AUTO_MERGE_IMPORT to "false"
      # to go back to opening the PR only.
      - name: Merge the import pull request
        if: ${{ vars.AGENTBANK_AUTO_MERGE_IMPORT != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "No open import pull request to merge."
            exit 0
          fi
          node scripts/import-backend-skill.mjs --check
          gh pr merge "$BRANCH" --merge --delete-branch
