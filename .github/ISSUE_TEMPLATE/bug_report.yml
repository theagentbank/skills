name: Bug report
description: Report reproducible skill, bootstrap, installation, or documentation behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or include credentials here. Use the private security-reporting link in SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps and redacted output.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - Codex
        - Claude Code
        - Hermes
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and relevant client version.
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed credentials, private keys, tokens, identity proofs, and personal financial data.
          required: true

